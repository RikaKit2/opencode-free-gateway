[package]
name = "opencode-free-gateway"
version = "0.1.0"
edition = "2021"
description = "Fast OpenAI-compatible gateway for OpenCode free models"
authors = ["RikaKit2"]

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["http1", "http2", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
